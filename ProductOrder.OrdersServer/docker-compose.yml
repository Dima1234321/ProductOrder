services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-9.1.0}
    container_name: productorder-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - productorder-elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  productorder-elasticsearch-data:
