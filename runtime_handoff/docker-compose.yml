services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - productorder-runtime-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C -b
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-9.1.0}
    platform: linux/amd64
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}"
    volumes:
      - productorder-runtime-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  products-api:
    image: productorder-products-api:runtime
    platform: linux/amd64
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Products: "Server=sqlserver,1433;Database=PRODUCTS;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  orders-api:
    image: productorder-orders-api:runtime
    platform: linux/amd64
    environment:
      PORT: 3001
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-orders}
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: productorder-client:runtime
    platform: linux/amd64
    ports:
      - "127.0.0.1:${CLIENT_PORT:-52579}:80"
    depends_on:
      - products-api
      - orders-api
    restart: unless-stopped

volumes:
  productorder-runtime-sql-data:
  productorder-runtime-elasticsearch-data:
